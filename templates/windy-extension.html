<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">

    <style>
        html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
}

#windy {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: visible !important;
}

/* Barre temporelle Windy */


#progress-bar {
    display: none !important;
}




       
    </style>

    <link   rel="stylesheet"   href="https://unpkg.com/leaflet@1.4.0/dist/leaflet.css"    >
    <script src="https://unpkg.com/leaflet@1.4.0/dist/leaflet.js"></script>
    <script src="https://api.windy.com/assets/map-forecast/libBoot.js"></script>
</head>


<script>
const options = {
    key:'ydO74Xuxv2WWOEShDpel1kaiae8zCnLO',
    verbose: false,
    lat: 45,
    lon: -3,
    zoom: 7
};

windyInit(options, windyAPI => {
     const {map, picker, utils, broadcast,store }  = windyAPI;
   // const { map, store } = windyAPI;
    // On reçoit les ordres de l'extension
  
   
   window.addEventListener("message", event => {
    if (event.origin !== "chrome-extension://" + event.origin.split("/")[2]
        && event.origin !== window.location.origin) {
        // Adapter le contrôle d'origine selon ton extension
    }
    if (!event.data) return;
    if (event.data.type === "setView") {
        map.setView(
            [event.data.lat, event.data.lon],
            event.data.zoom,
            { animate: false }
        );
    } else if (event.data.type === "setTime") {
        store.set("timestamp", event.data.timestamp);
    } else if (event.data.type === "getTime") {
        event.source?.postMessage({
            type: "windyTime",
            timestamp: store.get("timestamp")
        }, event.origin);
    }





    });

window.parent.postMessage(
    { type: "windyReady" },
    "*"
);




const barre = document.getElementById("progress-bar");

if (barre) {
    barre.addEventListener("pointerdown", e => {
        console.log("Windy pointerdown :", e.clientX, e.clientY);
    });

    barre.addEventListener("click", e => {
        console.log("Windy click :", e.clientX, e.clientY);
    });
}





});

</script>


<body>
<div id="windy"></div>
</body>
</html>
