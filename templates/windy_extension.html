<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">

    <style>
        html, body, #windy {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>

    <link   rel="stylesheet"   href="https://unpkg.com/leaflet@1.4.0/dist/leaflet.css"    >

    <script src="https://unpkg.com/leaflet@1.4.0/dist/leaflet.js"></script>
    <script src="https://api.windy.com/assets/map-forecast/libBoot.js"></script>
</head>

<body>

<div id="windy"></div>

<script>

const options = {
    key:'ydO74Xuxv2WWOEShDpel1kaiae8zCnLO',
    verbose: false,
    lat: 45,
    lon: -3,
    zoom: 7
};

windyInit(options, windyAPI => {

    const { map, store } = windyAPI;

    // On reçoit les ordres de l'extension
    window.addEventListener("message", event => {

        // On n'accepte que les messages utiles
        if (!event.data || event.data.type !== "setView") {
            return;
        }

        const lat = event.data.lat;
        const lon = event.data.lon;
        const zoom = event.data.zoom;

        map.setView([lat, lon], zoom, {
            animate: false
        });

    });

});





</script>

</body>
</html>
